nt": "a+b와 ab를 먼저 구하고 a³+b³ 공식을 사용하라.", "sol": "a=2+√3, b=2-√3. a+b=4, ab=1. 따라서 a³+b³=4³-3·1·4=52.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-1 · 인수분해", "q": "서로 다른 자연수 a,b가 a+b=7을 만족한다.\na²+b²가 가장 작을 때 ab를 구하여라.", "ans": "12", "hint": "합이 일정할 때 두 수가 가까울수록 제곱합이 작다.", "sol": "서로 다른 자연수 중 가장 가까운 쌍은 3,4이므로 ab=12.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-1 · 이차방정식", "q": "이차방정식 x²-5x+k=0의 두 근이 서로 다른 자연수이다.\n두 근의 차가 가장 작을 때 k를 구하여라.", "ans": "6", "hint": "두 근의 합은 5이다.", "sol": "가능한 자연수 쌍은 (1,4),(2,3). 차가 가장 작은 것은 2,3이고 곱은 6.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-1 · 이차방정식", "q": "두 실수 x,y가 x+y=7, xy=10을 만족한다.\n|x-y|를 구하여라.", "ans": "3", "hint": "(x-y)²=(x+y)²-4xy를 이용하라.", "sol": "(x-y)²=49-40=9이므로 |x-y|=3.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-1 · 이차함수", "q": "이차함수 y=(x-2)²-1의 그래프 위 서로 다른 두 점 A,B의 y좌표가 같다.\nA의 x좌표가 1일 때 B의 x좌표를 구하여라.", "ans": "3", "hint": "포물선의 축 x=2에 대한 대칭을 이용하라.", "sol": "x=1은 축에서 왼쪽으로 1, 다른 점은 오른쪽으로 1이므로 x=3.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-1 · 이차함수", "q": "이차함수 y=(x-3)²-2와 직선 y=2가 두 점 A,B에서 만난다.\nAB²을 구하여라.", "ans": "16", "hint": "두 교점의 y좌표가 같으므로 x좌표 차만 보면 된다.", "sol": "(x-3)²=4 → x=1,5. AB=4이므로 AB²=16.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 삼각비", "q": "직각삼각형 ABC에서 ∠C=90°이고 sin A=3/5이다.\nBC=6일 때 AC를 구하여라.", "ans": "8", "hint": "3:4:5 직각삼각형의 비를 생각하라.", "sol": "BC:AC:AB=3:4:5이고 BC=6이므로 2배. AC=8.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 삼각비", "q": "직각삼각형 ABC에서 ∠C=90°, AC=4, BC=3이다.\ntan A+tan B를 구하여라.", "ans": "25/12", "hint": "tan A=BC/AC, tan B=AC/BC.", "sol": "3/4+4/3=(9+16)/12=25/12.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 원의 성질", "q": "반지름이 5인 원에서 길이가 8인 현 AB가 있다.\n중심 O에서 AB에 내린 수선의 발을 H라 할 때 OH를 구하여라.", "ans": "3", "hint": "중심에서 현에 내린 수선은 현을 이등분한다.", "sol": "AH=4. 직각삼각형 OHA에서 OH=√(25-16)=3.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 원의 성질", "q": "반지름 13인 원에 길이가 10, 24인 두 평행한 현이 있다.\n두 현 사이의 거리가 7일 때,\n두 현이 중심의 같은 쪽이면 1, 반대쪽이면 2를 답하여라.", "ans": "1", "hint": "중심에서 두 현까지의 거리는 각각 얼마인지 구해 보라.", "sol": "거리들은 12와 5. 같은 쪽이면 차 7, 반대쪽이면 합 17. 따라서 1.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 통계", "q": "다섯 수 2,4,6,x,y의 평균과 중앙값이 모두 6이다.\nx<y일 때 x+y를 구하여라.", "ans": "18", "hint": "평균으로 전체 합부터 구하라.", "sol": "전체 합 30. 따라서 x+y=30-(2+4+6)=18.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "중3-2 · 통계", "q": "어떤 자료의 평균은 6, 분산은 3이다.\n모든 자료에 2를 더한 뒤 각각 2배하였다.\n새 자료의 평균과 분산의 합을 구하여라.", "ans": "28", "hint": "같은 수를 더하면 분산은 그대로, 2배 하면 분산은 4배.", "sol": "새 평균=(6+2)×2=16, 새 분산=3×4=12, 합은 28.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 다항식", "q": "a+b=4, ab=1일 때,\na⁴+b⁴을 구하여라.\na,b를 직접 구하지 말 것.", "ans": "194", "hint": "a²+b²를 먼저 구하라.", "sol": "a²+b²=16-2=14. a⁴+b⁴=14²-2=194.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 다항식", "q": "a+b=5, ab=6일 때,\na³+b³을 구하여라.", "ans": "35", "hint": "a³+b³=(a+b)³-3ab(a+b).", "sol": "125-3×6×5=35.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 방정식과 부등식", "q": "실수 x가 |x-2|+|x-5|=3을 만족한다.\n모든 해로 이루어진 구간의 길이를 구하여라.", "ans": "3", "hint": "수직선에서 2와 5까지 거리의 합을 생각하라.", "sol": "2≤x≤5에서는 거리의 합이 항상 3. 해의 구간 길이는 3.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 방정식과 부등식", "q": "정수 x가 |x-2|+|x-5|≤5를 만족한다.\n가능한 정수 x의 개수를 구하여라.", "ans": "6", "hint": "2와 5 사이에서는 합이 3이고, 바깥으로 1 이동하면 합이 2 증가한다.", "sol": "허용 범위는 1≤x≤6. 정수는 1,2,3,4,5,6의 6개.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 경우의 수", "q": "1,2,3,4 중 서로 다른 세 수를 골라 한 줄로 배열한다.\n단, 1과 2가 서로 이웃하면 안 된다.\n가능한 배열의 수를 구하여라.", "ans": "16", "hint": "전체에서 1과 2가 붙어 있는 경우를 빼라.", "sol": "전체 4P3=24. 붙는 경우는 세 번째 수 2가지×덩어리 배치 2가지×내부순서 2가지=8. 따라서 16.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 경우의 수", "q": "일렬로 놓인 7개의 자리 중 3자리를 고른다.\n고른 자리끼리는 서로 이웃하지 않아야 한다.\n고르는 방법의 수를 구하여라.", "ans": "10", "hint": "선택한 자리 사이에 빈 자리 하나씩을 미리 확보한다고 생각하라.", "sol": "서로 이웃하지 않는 3자리 선택 수는 C(5,3)=10.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}, {"topic": "공통수학1 · 행렬", "q": "A=[[1,2],[3,1]]일 때\nA²의 두 대각성분의 합을 구하여라.", "ans": "14", "hint": "A² 전체를 계산하지 말고 대각성분만 구해도 된다.", "sol": "(1,1)=1+6=7, (2,2)=6+1=7, 합은 14.", "source": "OpenStax/OATutor 공개 OER 기반 재구성"}];
const $=x=>document.getElementById(x);
function day(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function seed(){return Number(day().replaceAll('-',''))+Number(localStorage.getItem('reset_'+day())||0)*7919}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(x){return String(x).replace(/\s/g,'').replace(/−/g,'-').replace(/√/g,'sqrt').toLowerCase()}
function eq(a,b){if(norm(a)===norm(b))return true;let f=x=>{let m=norm(x).match(/^(-?\d+)\/(-?\d+)$/);return m?+m[1]/+m[2]:Number(norm(x))};let x=f(a),y=f(b);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9}
let current=[];
function logKey(i){return 'klog_'+day()+'_'+current[i].topic+'_'+current[i].q.slice(0,25)}
function getLog(i){return JSON.parse(localStorage.getItem(logKey(i))||'{"attempts":0,"correct":false,"hint":0,"answer":0}')}
function saveLog(i,l){localStorage.setItem(logKey(i),JSON.stringify(l))}
function pickSet(){
 let r=rng(seed()), idx=[...BANK.keys()];
 for(let i=idx.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 // Try to spread curriculum levels.
 const groups=["중2-2","중3-1","중3-2","공통수학1"];
 let chosen=[];
 for(const g of groups){let j=idx.find(x=>BANK[x].topic.startsWith(g)&&!chosen.includes(x));if(j!==undefined)chosen.push(j)}
 for(const j of idx){if(chosen.length>=5)break;if(!chosen.includes(j))chosen.push(j)}
 current=chosen.slice(0,5).map(i=>BANK[i]);
}
function render(){
 pickSet(); $('date').textContent=day()+' 오늘의 5문제'; $('nav').innerHTML=''; $('main').innerHTML='';
 current.forEach((p,i)=>{let n=i+1, b=document.createElement('button');b.textContent=n+'번';b.onclick=()=>$('p'+n).scrollIntoView({behavior:'smooth'});$('nav').appendChild(b);
 let l=getLog(i),s=document.createElement('section');s.className='problem';s.id='p'+n;
 s.innerHTML=`<div class="top"><b style="font-size:22px">문제 ${n}</b><span class="topic">${p.topic}</span></div>
 <div class="source">출처: ${p.source}</div><div class="q">${p.q}</div>
 <div class="row"><input id="in${n}" placeholder="답을 입력하세요"><button class="grade" onclick="grade(${i})">채점</button></div>
 <div id="fb${n}" class="feedback">${l.correct?'<span class="ok">✓ 정답 기록됨</span>':''}</div>
 <div class="actions"><button class="hintBtn" onclick="hint(${i})">힌트 보기</button><button class="ansBtn" onclick="answer(${i})">정답·해설 보기</button></div>
 <div class="box" id="h${n}">${p.hint}</div><div class="box" id="a${n}"><b>정답: ${p.ans}</b><br><br>${p.sol}</div>
 <div class="counter" id="c${n}">시도 ${l.attempts}회 · 힌트 ${l.hint}회 · 정답/해설 ${l.answer}회</div>`;$('main').appendChild(s);});
 updateStats();
}
function update(i){let l=getLog(i),n=i+1;$('c'+n).textContent=`시도 ${l.attempts}회 · 힌트 ${l.hint}회 · 정답/해설 ${l.answer}회`;updateStats()}
function grade(i){let n=i+1,v=$('in'+n).value.trim();if(!v)return;let l=getLog(i);l.attempts++;if(eq(v,current[i].ans))l.correct=true;saveLog(i,l);$('fb'+n).innerHTML=eq(v,current[i].ans)?'<span class="ok">✓ 정답!</span>':'<span class="no">✕ 다시 생각해 봐.</span>';update(i)}
function hint(i){let l=getLog(i);l.hint++;saveLog(i,l);$('h'+(i+1)).style.display='block';update(i)}
function answer(i){let l=getLog(i);l.answer++;saveLog(i,l);$('a'+(i+1)).style.display='block';update(i)}
function resetSet(){let k='reset_'+day();localStorage.setItem(k,Number(localStorage.getItem(k)||0)+1);render()}
function updateStats(){
 let dates=new Set();let d=new Date();for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()-i);dates.add(day(x))}
 let total=0,ok=0,h=0,a=0;
 for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith('klog_'))continue;let dt=k.slice(5,15);if(!dates.has(dt))continue;try{let l=JSON.parse(localStorage.getItem(k));if(l.attempts>0){total++;if(l.correct)ok++}h+=l.hint||0;a+=l.answer||0}catch(e){}}
 $('rate').textContent=(total?Math.round(ok/total*100):0)+'%';$('graded').textContent=total;$('hints').textContent=h+'회';$('answers').textContent=a+'회';
}
render();
</script></body></html>
