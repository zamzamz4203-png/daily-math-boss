<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Daily Math Boss v3</title>
<style>
:root{--bg:#09101f;--card:#141d38;--card2:#1a2648;--text:#f5f7ff;--muted:#aeb9d8;--accent:#8fa8ff;--good:#66e0aa;--bad:#ff8696;--warn:#ffd166}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:920px;margin:auto;padding:18px 14px 80px}.hero{padding:22px;border-radius:24px;background:linear-gradient(135deg,#192856,#35245e)}
h1{margin:0 0 8px;font-size:30px}.sub{line-height:1.65;color:#c9d2eb}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.09);font-size:13px}
.reset{margin-top:14px;border:0;border-radius:13px;padding:12px 15px;background:var(--warn);font-weight:900;cursor:pointer}
.stats{margin-top:14px;padding:18px;border-radius:20px;background:#111a32}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;border-radius:14px;background:#192343}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;margin-top:4px;font-size:22px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:7px;padding:10px 0;background:rgba(9,16,31,.92)}.nav button{flex:1;border:0;border-radius:12px;padding:11px;background:#25325b;color:#fff;font-weight:900}
.problem{scroll-margin-top:72px;margin:14px 0;padding:19px;border-radius:20px;background:var(--card)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.topic{padding:6px 9px;border-radius:999px;background:#283660;font-size:12px}.level{font-size:12px;color:#ffd166;margin-top:6px}
.source{margin:8px 0;color:#95a5cf;font-size:12px}.q{white-space:pre-line;line-height:1.9;font-size:17px}
.row{display:flex;gap:8px;margin-top:15px}input{flex:1;min-width:0;padding:12px;border:1px solid #37466f;border-radius:12px;background:#0c1530;color:#fff}.grade{border:0;border-radius:12px;padding:0 14px;background:var(--good);font-weight:900}
.feedback{min-height:22px;margin-top:7px;font-weight:800}.ok{color:var(--good)}.no{color:var(--bad)}.actions{display:flex;gap:8px;margin-top:8px}.actions button{border:0;border-radius:11px;padding:10px 12px;font-weight:800}.hintBtn{background:#344065;color:#fff}.ansBtn{background:var(--accent)}
.box{display:none;margin-top:10px;padding:13px;border-radius:13px;background:var(--card2);line-height:1.75}.counter{margin-top:9px;color:var(--muted);font-size:12px}.note{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.65}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>🇰🇷 Daily Math Boss</h1>
<div class="sub"><b>중2-2부터 공통수학1까지</b> 한국 교육과정 범위만 출제합니다. 숫자만 크게 만든 계산문제는 제외하고, 조건을 해석하고 여러 개념을 연결해야 풀리는 고난도 사고력 문제만 사용합니다.</div>
<div class="badges"><span class="badge" id="date"></span><span class="badge">매일 00:00 새 문제</span><span class="badge">한국어 문제만</span><span class="badge">심화 사고력</span></div>
<button class="reset" onclick="resetSet()">🔄 다른 5문제로 리셋</button>
</section>

<section class="stats">
<b>📊 최근 7일 학습 리포트</b>
<div class="grid" style="margin-top:12px">
<div class="stat"><span>정답률</span><b id="rate">0%</b></div>
<div class="stat"><span>채점 문제</span><b id="graded">0</b></div>
<div class="stat"><span>힌트 조회</span><b id="hints">0회</b></div>
<div class="stat"><span>정답 조회</span><b id="answers">0회</b></div>
</div>
</section>

<nav id="nav" class="nav"></nav>
<main id="main"></main>
<div class="note">외부 공개 수학 자료의 아이디어를 참고할 수 있으나, 앱에 노출되는 문항은 한국 교육과정과 용어에 맞게 다시 구성하고 검산한 문제만 사용합니다.</div>
</div>

<script>
const BANK = [
{topic:"중2-2 · 도형의 닮음",q:"△ABC에서 D, E는 각각 AB, AC 위의 점이고 DE∥BC이다.\nAD:DB=2:1이고, 사다리꼴 DBCE의 넓이가 △ADE의 넓이보다 5만큼 크다.\n△ABC의 넓이를 구하여라.",ans:"45",hint:"AD:AB=2:3이므로 넓이비는 4:9이다.",sol:"△ADE의 넓이를 4k, △ABC의 넓이를 9k라 두면 사다리꼴은 5k이다. 사다리꼴의 넓이는 5k이고 △ADE의 넓이는 4k이므로 두 넓이의 차는 k이다. k=5이므로 △ABC의 넓이는 9k=45.",alt:"45",level:"상"},
{topic:"중2-2 · 도형의 닮음",q:"△ABC에서 D, E는 각각 AB, AC 위의 점이고 DE∥BC이다.\nAD:DB=1:2이다. △ADE의 넓이가 4일 때, 사다리꼴 DBCE의 넓이를 구하여라.",ans:"32",hint:"닮음비 1:3 → 넓이비 1:9.",sol:"△ABC 넓이는 4×9=36, 사다리꼴은 36-4=32.",level:"상"},
{topic:"중2-2 · 확률",q:"1,2,3,4가 적힌 카드가 한 장씩 있다. 서로 다른 두 장을 차례로 뽑아 두 자리 수를 만든다.\n그 수가 짝수라는 사실을 알고 있을 때, 그 수가 30보다 클 확률을 구하여라.",ans:"1/2",hint:"조건부 확률처럼 '짝수인 경우'만 다시 전체 경우로 잡아라.",sol:"짝수인 두 자리 수는 12,14,24,32,34,42의 6개. 그중 30보다 큰 것은 32,34,42 세 개이므로 1/2.",level:"상"},
{topic:"중2-2 · 확률",q:"주사위를 두 번 던졌다. 두 눈의 합이 8 이상이라는 사실을 알고 있을 때, 두 눈이 같은 확률을 구하여라.",ans:"1/5",hint:"합이 8 이상인 순서쌍의 개수를 먼저 세어라.",sol:"합이 8,9,10,11,12인 경우는 5+4+3+2+1=15가지. 같은 눈이면서 합이 8 이상인 것은 (4,4),(5,5),(6,6) 3개이므로 3/15=1/5.",alt:"1/5",level:"최상"},
{topic:"중2-2 · 피타고라스",q:"직각삼각형의 두 직각변의 합이 14이고 빗변의 길이가 10이다. 이 삼각형의 넓이를 구하여라.",ans:"24",hint:"(a+b)²=a²+b²+2ab.",sol:"196=100+2ab이므로 ab=48. 넓이는 ab/2=24.",level:"상"},
{topic:"중2-2 · 피타고라스/닮음",q:"직각삼각형 ABC에서 ∠C=90°, AC=6, BC=8, AB=10이다. C에서 AB에 내린 수선의 발을 H라 할 때 AH:HB를 구하여라.",ans:"9:16",hint:"AH:HB=AC²:BC².",sol:"36:64=9:16.",level:"상"},

{topic:"중3-1 · 제곱근과 실수",q:"a=√(6+2√5), b=√(6-2√5)일 때, (a+b)²의 값을 구하여라.",ans:"20",hint:"각 근호 안을 완전제곱꼴로 바꿔라.",sol:"a=√5+1, b=√5-1이므로 a+b=2√5, 제곱하면 20.",level:"상"},
{topic:"중3-1 · 제곱근과 실수",q:"a=√(7+4√3), b=√(7-4√3)일 때, a³+b³을 구하여라.",ans:"52",hint:"a+b와 ab를 먼저 구하라.",sol:"a=2+√3, b=2-√3. a+b=4, ab=1. a³+b³=(a+b)³-3ab(a+b)=64-12=52.",level:"최상"},
{topic:"중3-1 · 인수분해",q:"자연수 a,b가 a+b=9를 만족하고 a≠b이다. a²+b²가 가장 작을 때 ab의 값을 구하여라.",ans:"20",hint:"합이 일정하면 두 수가 가까울수록 제곱합이 작다.",sol:"서로 다른 자연수 중 가장 가까운 쌍은 4,5이므로 ab=20.",level:"상"},
{topic:"중3-1 · 이차방정식",q:"이차방정식 x²-9x+k=0의 두 근이 서로 다른 자연수이다. 두 근의 차가 가장 작을 때 k를 구하여라.",ans:"20",hint:"두 근의 합은 9.",sol:"가능한 자연수 쌍 중 가장 가까운 것은 4와 5이므로 k=4×5=20.",level:"상"},
{topic:"중3-1 · 이차방정식",q:"두 실수 x,y가 x+y=10, xy=21을 만족한다. |x-y|를 구하여라.",ans:"4",hint:"(x-y)²=(x+y)²-4xy.",sol:"100-84=16이므로 |x-y|=4.",level:"상"},
{topic:"중3-1 · 이차함수",q:"이차함수 y=(x-1)²-4의 그래프 위 두 점 A,B의 y좌표가 같고, A의 x좌표가 -2이다. B의 x좌표를 구하여라.",ans:"4",hint:"축 x=1에 대한 대칭.",sol:"-2는 축에서 3만큼 왼쪽이므로 대칭점은 1+3=4.",level:"상"},
{topic:"중3-1 · 이차함수",q:"이차함수 y=(x-2)²-1과 직선 y=8이 두 점 A,B에서 만난다. 선분 AB의 길이를 구하여라.",ans:"6",hint:"교점의 y좌표가 같으므로 x좌표의 차만 구하면 된다.",sol:"(x-2)²=9이므로 x=-1,5. 길이는 6.",level:"상"},

{topic:"중3-2 · 삼각비",q:"직각삼각형 ABC에서 ∠C=90°, tan A=3/4이고 AC=8이다. 삼각형 ABC의 넓이를 구하여라.",ans:"24",hint:"tan A=BC/AC.",sol:"BC/8=3/4이므로 BC=6. 넓이는 8×6÷2=24.",level:"상"},
{topic:"중3-2 · 삼각비",q:"직각삼각형 ABC에서 ∠C=90°, sin A=3/5이다. cos A+tan A의 값을 구하여라.",ans:"31/20",hint:"3:4:5 삼각형을 이용하라.",sol:"cos A=4/5, tan A=3/4. 합은 16/20+15/20=31/20.",level:"상"},
{topic:"중3-2 · 원의 성질",q:"반지름이 13인 원에서 길이가 10인 현 AB가 있다. 중심 O에서 AB에 내린 수선의 발을 H라 할 때 OH를 구하여라.",ans:"12",hint:"AH=5.",sol:"OH=√(13²-5²)=√144=12.",level:"상"},
{topic:"중3-2 · 원의 성질",q:"반지름이 10인 원에서 중심 O로부터 어떤 현 AB까지의 거리가 6이다. 현 AB의 길이를 구하여라.",ans:"16",hint:"중심에서 현에 내린 수선은 현을 이등분한다.",sol:"반현의 길이는 √(10²-6²)=8, 따라서 현은 16.",level:"상"},
{topic:"중3-2 · 통계",q:"5개의 수 2,4,6,x,y의 평균이 8이고 중앙값이 6이다. x≤y일 때 x+y를 구하여라.",ans:"28",hint:"평균으로 전체 합부터 구하라.",sol:"전체 합은 40. 이미 2+4+6=12이므로 x+y=28.",level:"상"},
{topic:"중3-2 · 통계",q:"어떤 자료의 평균이 5, 분산이 4이다. 모든 자료에 3을 더한 뒤 각각 2배하였다. 새 자료의 평균과 분산의 합을 구하여라.",ans:"32",hint:"평행이동은 분산을 바꾸지 않고, 2배하면 분산은 4배.",sol:"새 평균=(5+3)×2=16, 새 분산=4×4=16, 합은 32.",level:"상"},

{topic:"공통수학1 · 다항식",q:"a+b=5, ab=3일 때 a⁴+b⁴을 구하여라. a,b를 직접 구하지 말 것.",ans:"343",hint:"a²+b²부터 구하라.",sol:"a²+b²=25-6=19. a⁴+b⁴=19²-2×9=361-18=343.",level:"최상"},
{topic:"공통수학1 · 다항식",q:"a+b=6, ab=5일 때 a³+b³을 구하여라.",ans:"126",hint:"a³+b³=(a+b)³-3ab(a+b).",sol:"216-90=126.",level:"상"},
{topic:"공통수학1 · 방정식과 부등식",q:"실수 x가 |x-1|+|x-7|=6을 만족한다. 모든 해로 이루어진 구간의 길이를 구하여라.",ans:"6",hint:"두 점 1과 7 사이에서는 거리의 합이 항상 6.",sol:"해는 1≤x≤7, 구간 길이는 6.",level:"상"},
{topic:"공통수학1 · 방정식과 부등식",q:"정수 x가 |x-2|+|x-6|≤6을 만족한다. 가능한 정수 x의 개수를 구하여라.",ans:"7",hint:"2와 6 사이에서는 합이 4. 양쪽으로 1 이동할 때 합은 2씩 증가한다.",sol:"허용 범위는 1≤x≤7. 정수는 7개.",level:"상"},
{topic:"공통수학1 · 경우의 수",q:"1,2,3,4,5 중 서로 다른 세 수를 골라 한 줄로 배열한다. 단, 1과 2는 서로 이웃하면 안 된다. 가능한 배열의 수를 구하여라.",ans:"42",hint:"전체에서 1과 2가 붙어 있는 경우를 빼라.",sol:"전체는 5P3=60. 붙는 경우: 세 번째 수 3가지 × 덩어리 배치 3가지 × 내부순서 2가지 =18. 따라서 42.",level:"최상"},
{topic:"공통수학1 · 경우의 수",q:"일렬로 놓인 8개의 자리 중 3자리를 고른다. 고른 자리끼리는 서로 이웃하지 않아야 한다. 고르는 방법의 수를 구하여라.",ans:"20",hint:"서로 이웃하지 않는 k개 선택 공식 또는 빈칸을 끼워 넣는 방법.",sol:"C(8-3+1,3)=C(6,3)=20.",level:"상"},
{topic:"공통수학1 · 행렬",q:"A=[[1,2],[2,1]]일 때 A²의 모든 성분의 합을 구하여라.",ans:"18",hint:"A²를 직접 계산해도 되지만 행과 열의 구조를 관찰해도 된다.",sol:"A²=[[5,4],[4,5]], 합은 18.",level:"상"},
{topic:"공통수학1 · 행렬",q:"A=[[1,1],[1,0]]일 때 A³의 (1,2) 성분을 구하여라.",ans:"2",hint:"A²를 먼저 구한 뒤 A를 한 번 더 곱하라.",sol:"A²=[[2,1],[1,1]], A³=[[3,2],[2,1]], 따라서 (1,2) 성분은 2.",level:"최상"}
];

const $=id=>document.getElementById(id);
function dkey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function currentSeed(){return Number(dkey().replaceAll('-','')) + Number(localStorage.getItem('reset_'+dkey())||0)*104729}
function norm(x){return String(x).replace(/\s/g,'').replace(/−/g,'-').replace(/√/g,'sqrt').toLowerCase()}
function numeric(x){let s=norm(x);let m=s.match(/^(-?\d+)\/(-?\d+)$/);if(m)return +m[1]/+m[2];if(/^[-+]?\d+(\.\d+)?$/.test(s))return +s;return NaN}
function correct(input,p){if(norm(input)===norm(p.ans))return true;if(p.alt && norm(input)===norm(p.alt))return true;let a=numeric(input),b=numeric(p.ans);return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<1e-9}
let current=[];
function pick(){
 let r=seeded(currentSeed()), ids=[...BANK.keys()];
 for(let i=ids.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 const groups=["중2-2","중3-1","중3-2","공통수학1"];
 let chosen=[];
 groups.forEach(g=>{let x=ids.find(i=>BANK[i].topic.startsWith(g)&&!chosen.includes(i));if(x!==undefined)chosen.push(x)});
 for(const i of ids){if(chosen.length>=5)break;if(!chosen.includes(i))chosen.push(i)}
 current=chosen.slice(0,5).map(i=>BANK[i]);
}
function logKey(i){return 'mathlog_'+dkey()+'_'+current[i].topic+'_'+current[i].q.slice(0,18)}
function getLog(i){return JSON.parse(localStorage.getItem(logKey(i))||'{"attempts":0,"correct":false,"hint":0,"answer":0}')}
function saveLog(i,l){localStorage.setItem(logKey(i),JSON.stringify(l))}
function render(){
 pick(); $('date').textContent=dkey()+' 오늘의 5문제'; $('nav').innerHTML=''; $('main').innerHTML='';
 current.forEach((p,i)=>{
  let n=i+1,b=document.createElement('button');b.textContent=n+'번';b.onclick=()=>$('p'+n).scrollIntoView({behavior:'smooth'});$('nav').appendChild(b);
  let l=getLog(i),s=document.createElement('section');s.className='problem';s.id='p'+n;
  s.innerHTML=`<div class="top"><b style="font-size:22px">문제 ${n}</b><span class="topic">${p.topic}</span></div>
  <div class="level">난이도: ${p.level}</div>
  <div class="source">한국 교육과정 검수형 · 외부 공개 문제 아이디어 재구성</div>
  <div class="q">${p.q}</div>
  <div class="row"><input id="in${n}" placeholder="답을 입력하세요"><button class="grade" onclick="grade(${i})">채점</button></div>
  <div id="fb${n}" class="feedback">${l.correct?'<span class="ok">✓ 정답 기록됨</span>':''}</div>
  <div class="actions"><button class="hintBtn" onclick="hint(${i})">힌트 보기</button><button class="ansBtn" onclick="answer(${i})">정답·해설 보기</button></div>
  <div class="box" id="h${n}">${p.hint}</div><div class="box" id="a${n}"><b>정답: ${p.alt||p.ans}</b><br><br>${p.sol}</div>
  <div class="counter" id="c${n}">시도 ${l.attempts}회 · 힌트 ${l.hint}회 · 정답/해설 ${l.answer}회</div>`;
  $('main').appendChild(s);
 });
 updateStats();
}
function updateLine(i){let l=getLog(i),n=i+1;$('c'+n).textContent=`시도 ${l.attempts}회 · 힌트 ${l.hint}회 · 정답/해설 ${l.answer}회`;updateStats()}
function grade(i){let n=i+1,v=$('in'+n).value.trim();if(!v)return;let l=getLog(i);l.attempts++;if(correct(v,current[i]))l.correct=true;saveLog(i,l);$('fb'+n).innerHTML=correct(v,current[i])?'<span class="ok">✓ 정답!</span>':'<span class="no">✕ 다시 생각해 봐.</span>';updateLine(i)}
function hint(i){let l=getLog(i);l.hint++;saveLog(i,l);$('h'+(i+1)).style.display='block';updateLine(i)}
function answer(i){let l=getLog(i);l.answer++;saveLog(i,l);$('a'+(i+1)).style.display='block';updateLine(i)}
function resetSet(){let k='reset_'+dkey();localStorage.setItem(k,Number(localStorage.getItem(k)||0)+1);render()}
function updateStats(){
 let ds=new Set(),d=new Date();for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()-i);ds.add(dkey(x))}
 let total=0,ok=0,h=0,a=0;
 for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith('mathlog_'))continue;let dt=k.slice(8,18);if(!ds.has(dt))continue;try{let l=JSON.parse(localStorage.getItem(k));if(l.attempts>0){total++;if(l.correct)ok++}h+=l.hint||0;a+=l.answer||0}catch(e){}}
 $('rate').textContent=(total?Math.round(ok/total*100):0)+'%';$('graded').textContent=total;$('hints').textContent=h+'회';$('answers').textContent=a+'회';
}
render();
</script>
</body>
</html>
